<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>2021–23 Alfabetik FSP A–Z</title>

  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

  <style>
    :root{
      --border:#e9e9e9;
      --muted:#6b6b6b;
      --bg:#ffffff;
      --hover:#f7f7f7;

      --active:#cfe9ff;
      --activeGlow: 0 0 0 2px rgba(43,124,255,.34) inset, 0 12px 26px rgba(43,124,255,.14);

      --shadow: 0 12px 30px rgba(0,0,0,.12);

      --blue:#2b7cff;
      --blueGlow: 0 0 0 4px rgba(43,124,255,.24), 0 10px 22px rgba(43,124,255,.10);

      --green:#16a34a;
      --greenGlow: 0 0 0 4px rgba(22,163,74,.22), 0 10px 22px rgba(22,163,74,.10);

      --orange:#f59e0b;
    }

    body{
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 18px;
      max-width: 980px;
      color:#111;
      background: var(--bg);
      line-height: 1.10;
    }

    #appScale{
      transform-origin: top left;
      will-change: transform;
    }

    .pageTitle{
      font-size: 1.6rem;
      font-weight: 700;
      color: #0b5fff;
      background: #f1f5ff;
      padding: 12px 16px;
      border-radius: 14px;
      margin-bottom: 14px;
    }

    /* NAV */
    .navRow{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap: wrap;
      margin: 0 0 12px 0;
    }
    .navLink{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid #d8d8d8;
      background: white;
      color:#111;
      text-decoration:none;
      font-size: .95rem;
      line-height: 1;
      user-select:none;
      transition: background .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .navLink:hover{ background: var(--hover); }
    .navLink.on{
      border-color:var(--blue);
      background: rgba(43,124,255,.10);
      box-shadow: 0 0 0 3px rgba(43,124,255,.16) inset;
    }

    .topbar{
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    #search{
      flex: 1 1 520px;
      min-width: 220px;
      padding: 10px 12px;
      border: 1px solid #d8d8d8;
      border-radius: 14px;
      font-size: 1rem;
      outline: none;
    }

    #resetBtn{
      padding: 10px 16px;
      border: 1px solid #d8d8d8;
      border-radius: 14px;
      background: white;
      cursor: pointer;
      font-size: 1rem;
      flex: 0 0 auto;
    }
    #resetBtn:hover{ background: var(--hover); }

    /* Zoom (SVG) */
    .zoomWrap{
      display:flex;
      align-items:center;
      gap: 24px;
      margin-left: 14px;
      padding: 6px;
      border: 1px solid #d8d8d8;
      border-radius: 14px;
      background: white;
      user-select:none;
      flex: 0 0 auto;
    }
    .zoomBtn{
      height: 36px;
      width: 48px;
      border-radius: 12px;
      border: 1px solid #d8d8d8;
      background: white;
      cursor: pointer;
      line-height: 1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .15s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease, filter .15s ease;
    }
    .zoomBtn:hover{ background: var(--hover); }
    .zoomBtn:disabled{ opacity: .35; cursor: default; }

    .zoomBtn svg{
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .95;
    }

    .zoomBtn.zoomOut,
    .zoomBtn.zoomIn{
      opacity: .55;
      filter: saturate(1.2);
      color: #111;
    }

    .zoomBtn.enabled.zoomOut{
      opacity: 1;
      background: rgba(255, 149, 0, .18);
      border-color: rgba(255, 149, 0, .70);
      box-shadow: 0 0 0 3px rgba(255, 149, 0, .16) inset, 0 8px 18px rgba(255, 149, 0, .12);
      filter: saturate(1.7);
      color: #b45309;
    }
    .zoomBtn.enabled.zoomIn{
      opacity: 1;
      background: rgba(34, 197, 94, .18);
      border-color: rgba(34, 197, 94, .70);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, .16) inset, 0 8px 18px rgba(34, 197, 94, .12);
      filter: saturate(1.7);
      color: #15803d;
    }

    #meta{
      color: var(--muted);
      font-size: .95rem;
      margin: 6px 0 12px 2px;
      line-height: 1.05;
    }

    /* Grid: Kayıt | Süre | ▶(count) | ⭐ | ✓ | ⬇︎ | ⬇︎(count) */
    .headerRow, .itemRow{
      display: grid;
      grid-template-columns: minmax(0, 1fr) 8ch 54px 36px 36px 36px 54px;
      align-items: center;
      column-gap: 8px;
    }

    .headerRow{
      padding: 6px 8px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.05;
    }

    .titleHead, .durHead{
      display:flex;
      align-items:center;
      gap:8px;
      user-select:none;
      width: 100%;
    }
    .titleHead{ justify-content:flex-start; }
    .durHead{ justify-content:flex-end; }

    .headIconCell{
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
    }

    .sortBtn{
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid #d8d8d8;
      background: white;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      color:#111;
      flex: 0 0 auto;
    }
    .sortBtn:hover{ background: var(--hover); }
    .sortBtn svg{ width:14px; height:14px; }
    .sortBtn.on{
      border-color:var(--blue);
      box-shadow: 0 0 0 3px rgba(43,124,255,.12) inset;
    }

    /* Dual-icon sort buttons (play/download count) */
    .sortBtn.dual{
      width: 34px;
      height: 34px;
      position: relative;
      border-radius: 12px;
    }
    .sortBtn.dual svg{ width:auto; height:auto; }
    .sortBtn.dual .mainIcon{
      width: 20px;
      height: 20px;
      display:block;
    }
    .sortBtn.dual .dirIcon{
      position:absolute;
      right: 4px;
      bottom: 3px;
      width: 12px;
      height: 12px;
      opacity: .95;
    }
    .iconOrange{ fill: var(--orange); }
    .iconBlue{ fill: var(--blue); }

    #list{
      border-bottom: 1px solid var(--border);
    }

    /* Zebra */
    .itemRow{
      padding: 4px 8px;
      border-bottom: 1px solid #ececec;
      cursor: pointer;
      background: #f7f7f7;
    }
    #list .itemRow:nth-child(even){
      background: #eeeeee;
    }
    .itemRow:hover{ background: var(--hover); }

    /* Aktif satır */
    .itemRow.active{
      background: var(--active) !important;
      box-shadow: var(--activeGlow);
      position: relative;
    }
    .itemRow.active:hover{ background: var(--active) !important; }
    .itemRow.active::before{
      content:"";
      position:absolute;
      left:0;
      top:0;
      bottom:0;
      width:4px;
      background: var(--blue);
      border-radius: 4px;
    }

    .title{
      font-size: 1.02rem;
      font-weight: 500;
      line-height: 1.02;
      min-width: 0;
    }

    .dur{
      text-align:right;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: .95rem;
      user-select:none;
      white-space: nowrap;
      line-height: 1.00;
    }

    .countCell{
      text-align: right;
      color: #404040;
      font-variant-numeric: tabular-nums;
      font-size: .92rem;
      user-select:none;
      white-space: nowrap;
      line-height: 1.00;
      padding-right: 2px;
    }

    @media (max-width: 680px){
      body{ margin: 14px; }
      .headerRow, .itemRow{ grid-template-columns: minmax(0, 1fr) 8ch 46px 34px 34px 34px 46px; }
      .title{
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #search{ flex: 1 1 100%; }
      .zoomWrap{ margin-left: 0; }
    }

    .iconBtn{
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid #d8d8d8;
      background: white;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor: pointer;
      flex: 0 0 auto;
      user-select:none;
      justify-self: center;
      transition: box-shadow .15s ease, border-color .15s ease, background .15s ease;
    }
    .iconBtn:hover{ background: var(--hover); }
    .iconBtn.on{
      border-color:var(--blue);
      background: rgba(43,124,255,.10);
      box-shadow: var(--blueGlow);
    }
    .iconBtn[data-kind="check"].on{
      border-color: var(--green);
      background: rgba(22,163,74,.14);
      box-shadow: var(--greenGlow);
    }
    .iconBtn[data-kind="check"].on svg{
      stroke: var(--green);
      stroke-width: 2.6;
    }
    .iconBtn svg{ width: 14px; height: 14px; opacity: .9; }

    .filterBtn{
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid #d8d8d8;
      background: white;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      color:#111;
    }
    .filterBtn:hover{ background: var(--hover); }
    .filterBtn.on{
      border-color:var(--blue);
      box-shadow: 0 0 0 3px rgba(43,124,255,.12) inset;
    }
    .filterBtn svg{ width:14px; height:14px; }

    /* Floating player */
    #floatingPlayer{
      position: fixed;
      left: max(18px, env(safe-area-inset-left));
      bottom: max(18px, env(safe-area-inset-bottom));
      width: min(720px, calc(100vw - 36px));
      background: white;

      border: 1.5px solid #d6d6d6;
      border-right-color: #bdbdbd;
      border-bottom-color:#b3b3b3;
      border-radius: 18px;

      box-shadow:
        10px 34px 86px rgba(0,0,0,.20),
        4px 14px 30px rgba(0,0,0,.10),
        0px 2px 6px rgba(0,0,0,.06);

      overflow: hidden;
      z-index: 9999;

      -webkit-transform: translateZ(0);
      transform: translateZ(0);
      transform-origin: top left;
      will-change: transform;
      transition: opacity .18s ease;
      touch-action: none;
    }

    #floatingPlayer.hiddenWhileTyping{
      opacity: 0;
      pointer-events: none;
    }

    #fpHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 10px 12px;
      background: #fbfbfb;

      cursor: grab;
      user-select:none;
      gap: 10px;
      touch-action: none;
      line-height: 1.05;

      border-bottom: none;
      position: relative;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.85),
        inset 0 -1px 0 rgba(0,0,0,.04);
    }

    #fpHeader::after{
      content:"";
      position:absolute;
      left:0; right:0; bottom:0;
      height: 2px;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,.18),
        rgba(255,255,255,.80)
      );
    }

    #fpTitle{
      font-weight: 650;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1 1 auto;
      min-width: 0;
      line-height: 1.12;
    }

    #fpHeaderRight{
      display:flex;
      align-items:center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .miniBtn{
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid #d8d8d8;
      background: white;
      cursor: pointer;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .miniBtn:hover{ background: var(--hover); }
    .miniBtn svg{ width:16px; height:16px; }

    .speedWrap{
      display:flex;
      align-items:center;
      gap: 6px;
      padding: 4px;
      border: 1px solid #d8d8d8;
      border-radius: 14px;
      background: white;
      user-select:none;
    }
    .speedCtlBtn{
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid #d8d8d8;
      background: white;
      cursor: pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 18px;
      line-height: 1;
    }
    .speedCtlBtn:hover{ background: var(--hover); }

    .speedValue{
      min-width: 56px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid #d8d8d8;
      background: white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      padding: 0 10px;
      cursor: default;
    }
    .speedValue.on{
      border-color:var(--blue);
      box-shadow: 0 0 0 3px rgba(43,124,255,.12) inset;
    }

    #fpBody{
      padding: 10px 12px 12px 12px;
      box-shadow: inset 0 1px 0 rgba(0,0,0,.05);
    }

    #status{
      margin: 8px 2px 0 2px;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.05;
    }

    .plyr--audio .plyr__controls{
      border-radius: 12px;
      flex-wrap: wrap;
      row-gap: 8px;
    }
    .plyr--audio .plyr__controls .plyr__progress{
      flex: 1 1 100%;
      min-width: 0;
    }

    @media (max-width: 680px){
      #fpHeader{ flex-wrap: wrap; gap: 8px; }
      #fpTitle{
        flex: 1 1 100%;
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
      }
      #fpHeaderRight{
        width: 100%;
        justify-content: flex-end;
      }
    }

    .diseaseName{
      color: #c2410c;
      font-weight: 650;
    }
  </style>
</head>

<body>
  <div id="appScale">
    <h1 class="pageTitle">Alfabetik 2021–23 FSP A–Z</h1>

    <nav class="navRow" aria-label="Sayfalar">
      <a class="navLink" href="https://protokolfsp.github.io/fsp-audio/">Güncel</a>
      <a class="navLink" href="https://protokolfsp.github.io/FSP2022-23/">2021–23</a>
      <a class="navLink" href="https://protokolfsp.github.io/All-in-One/">All-in-One</a>
    </nav>

    <div class="topbar">
      <input id="search" type="text" placeholder="Arama (ör. ACS, DM, PAVK)..." />
      <button id="resetBtn" type="button">Hepsi</button>

      <div class="zoomWrap" aria-label="Görünüm">
        <button id="zoomOutBtn" class="zoomBtn zoomOut" type="button" aria-label="Küçült">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6"></circle>
            <path d="M20 20l-3.5-3.5"></path>
            <path d="M8.5 11h5"></path>
          </svg>
        </button>

        <button id="zoomInBtn" class="zoomBtn zoomIn" type="button" aria-label="Büyüt">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6"></circle>
            <path d="M20 20l-3.5-3.5"></path>
            <path d="M11 8.5v5"></path>
            <path d="M8.5 11h5"></path>
          </svg>
        </button>
      </div>
    </div>

    <div id="meta">Görünən: 0 / Toplam: 0</div>

    <div class="headerRow">
      <div class="colTitle">
        <div class="titleHead">
          <span>Kayıt</span>
          <button id="sortDateBtn" class="sortBtn" type="button" title="Tarihe göre sırala (dosya sonu)">
            <svg id="sortDateIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14"/><path d="M7 14l5 5 5-5"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="colDur" style="text-align:right;">
        <div class="durHead">
          <span>Süre</span>
          <button id="sortDurBtn" class="sortBtn" type="button" title="Süreye göre sırala">
            <svg id="sortDurIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14"/><path d="M7 14l5 5 5-5"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- ▶︎ Sort (play count) -->
      <div class="headIconCell">
        <button id="sortPlayBtn" class="sortBtn dual" type="button" title="Dinlenme sayısına göre sırala">
          <svg class="mainIcon" viewBox="0 0 24 24" aria-hidden="true">
            <path class="iconBlue" d="M3 10v4c0 .55.45 1 1 1h3l5 4V5L7 9H4c-.55 0-1 .45-1 1z"/>
            <path class="iconOrange" d="M16.5 8.5a1 1 0 0 1 1.4.1c1 1.2 1.6 2.7 1.6 4.4s-.6 3.2-1.6 4.4a1 1 0 1 1-1.5-1.3c.7-.9 1.1-2 1.1-3.1s-.4-2.2-1.1-3.1a1 1 0 0 1 .1-1.4z"/>
          </svg>
          <svg id="sortPlayIcon" class="dirIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"></svg>
        </button>
      </div>

      <div class="headIconCell">
        <button id="filterFav" class="filterBtn" title="Favoriler filtrele" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1L12 2z"/>
          </svg>
        </button>
      </div>

      <div class="headIconCell">
        <button id="filterSel" class="filterBtn" title="Seçilenler filtrele" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </button>
      </div>

      <div class="headIconCell" aria-hidden="true"></div>

      <!-- ⬇︎ Sort (download count) -->
      <div class="headIconCell">
        <button id="sortDlCountBtn" class="sortBtn dual" type="button" title="İndirme sayısına göre sırala">
          <svg class="mainIcon" viewBox="0 0 24 24" aria-hidden="true">
            <path class="iconBlue" d="M4 3h12l4 4v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
            <path class="iconOrange" d="M7 3h8v6H7V3zm4 10.2a3.3 3.3 0 1 0 0 6.6 3.3 3.3 0 0 0 0-6.6z"/>
          </svg>
          <svg id="sortDlCountIcon" class="dirIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"></svg>
        </button>
      </div>
    </div>

    <div id="list"></div>
    <div id="status"></div>
  </div>

  <div id="floatingPlayer" role="region" aria-label="Oynatıcı">
    <div id="fpHeader" title="Sürükle">
      <div id="fpTitle">Bir kayıt seç...</div>
      <div id="fpHeaderRight">
        <div id="speedWrap" class="speedWrap" aria-label="Hız">
          <button id="slowBtn" class="speedCtlBtn" type="button" title="Yavaşlat (🐢)">🐢</button>
          <div id="speedValue" class="speedValue on" title="Oynatma hızı">1×</div>
          <button id="fastBtn" class="speedCtlBtn" type="button" title="Hızlandır (🐇)">🐇</button>
        </div>

        <button id="prevBtn" class="miniBtn" type="button" title="Önceki">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 20L9 12l10-8v16z"/><path d="M5 19V5"/>
          </svg>
        </button>
        <button id="nextBtn" class="miniBtn" type="button" title="Sonraki">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 4l10 8-10 8V4z"/><path d="M19 5v14"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="fpBody">
      <audio id="player" class="js-player" controls preload="metadata"></audio>
    </div>
  </div>

  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

  <script>
    // =========================
    // Archive source
    // =========================
    const ARCHIVE_ID = "FSP21_23";
    const BASE = `https://archive.org/download/${ARCHIVE_ID}/`;
    const DL_PROXY = "https://fspdownload.protokolfsp.workers.dev/";

    // Sayaç API (play/download)
    const COUNTER_API = "https://fspdlcounter.protokolfsp.workers.dev";

    const IS_SAFARI = (() => {
      const ua = navigator.userAgent || "";
      const isApple = /Mac|iPhone|iPad|iPod/i.test(ua);
      const hasSafari = /Safari/i.test(ua);
      const notChromeLike = !/Chrome|Chromium|CriOS|FxiOS|EdgiOS|Edg|OPR/i.test(ua);
      return isApple && hasSafari && notChromeLike;
    })();

    // =========================
    // DOM
    // =========================
    const listEl   = document.getElementById("list");
    const searchEl = document.getElementById("search");
    const metaEl   = document.getElementById("meta");
    const statusEl = document.getElementById("status");

    const appScaleEl = document.getElementById("appScale");
    const zoomOutBtn = document.getElementById("zoomOutBtn");
    const zoomInBtn  = document.getElementById("zoomInBtn");

    const fp = document.getElementById("floatingPlayer");
    const fpHeader = document.getElementById("fpHeader");
    const fpTitle = document.getElementById("fpTitle");

    const playerEl = document.getElementById("player");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    const slowBtn = document.getElementById("slowBtn");
    const fastBtn = document.getElementById("fastBtn");
    const speedValueEl = document.getElementById("speedValue");

    const filterFavBtn  = document.getElementById("filterFav");
    const filterSelBtn  = document.getElementById("filterSel");

    // =========================
    // Counters
    // =========================
    let globalPlayCounts = {};
    let globalDownloadCounts = {};
    let counterStatus = "";

    function chunk(arr, size){
      const out = [];
      for (let i=0; i<arr.length; i+=size) out.push(arr.slice(i, i+size));
      return out;
    }

    async function fetchCounts(type, ids){
      if (!ids.length) return {};
      try{
        const res = await fetch(COUNTER_API + "/counts", {
          method: "POST",
          mode: "cors",
          cache: "no-store",
          headers: { "content-type": IS_SAFARI ? "text/plain;charset=utf-8" : "application/json" },
          body: JSON.stringify({ type, ids })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const j = await res.json();
        if (!j || j.ok !== true || !j.counts) throw new Error("bad json");
        counterStatus = "";
        return j.counts || {};
      }catch{
        return null; // kritik: mevcut sayacı silme
      }
    }

    let refreshCountsTimer = null;
    function scheduleRefreshCounts(ms = 800){
      clearTimeout(refreshCountsTimer);
      refreshCountsTimer = setTimeout(() => refreshAllCounts().catch(()=>{}), ms);
    }

    async function refreshAllCounts(){
      if (!items.length) return;

      const ids = items.map(it => it.id);
      const parts = chunk(ids, 200);

      const playAll = { ...globalPlayCounts };
      const dlAll   = { ...globalDownloadCounts };

      let anyOk = false;

      for (const part of parts){
        const [p, d] = await Promise.all([
          fetchCounts("play", part),
          fetchCounts("download", part),
        ]);

        if (p && typeof p === "object"){
          anyOk = true;
          for (const id of part) playAll[id] = Number(p[id]) || 0;
        }
        if (d && typeof d === "object"){
          anyOk = true;
          for (const id of part) dlAll[id] = Number(d[id]) || 0;
        }
      }

      if (anyOk){
        globalPlayCounts = playAll;
        globalDownloadCounts = dlAll;
        counterStatus = "";
      } else {
        counterStatus = "Sayaç bağlantısı geçici olarak yok (değerler korunuyor).";
      }

      render();
    }

    function sendHit(type, it){
      try{
        const payload = {
          type,
          id: it?.id || "",
          title: it?.title || "",
          file_name: (it?.file || it?.name || "").split("/").pop() || ""
        };
        const url = COUNTER_API + "/hit";
        const data = JSON.stringify(payload);

        if (navigator.sendBeacon){
          const ok = navigator.sendBeacon(url, new Blob([data], { type: "text/plain;charset=utf-8" }));
          if (ok) return;
        }

        fetch(url, {
          method: "POST",
          mode: "cors",
          cache: "no-store",
          keepalive: true,
          headers: { "content-type": IS_SAFARI ? "text/plain;charset=utf-8" : "application/json" },
          body: data
        }).catch(() => {});
      }catch{}
    }

    // =========================
    // Helpers
    // =========================
    function escHtml(s){
      return (s ?? "").toString()
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;");
    }

    function highlightDisease(title){
      const raw = (title ?? "").toString();
      const m = raw.match(/\b(dr|fr)\b\.?/i);
      if (!m || m.index == null) return escHtml(raw);

      const i = m.index;
      const leftRaw = raw.slice(0, i);
      const leftTrim = leftRaw.trimEnd();
      if (!leftTrim.trim()) return escHtml(raw);

      const trailing = leftRaw.slice(leftTrim.length);
      return `<span class="diseaseName">${escHtml(leftTrim)}</span>${escHtml(trailing)}${escHtml(raw.slice(i))}`;
    }

    function normTR(s){
      return (s || "")
        .toLocaleLowerCase("tr")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/ı/g, "i")
        .replace(/İ/g, "i")
        .replace(/ü/g, "u")
        .replace(/ö/g, "o")
        .replace(/ş/g, "s")
        .replace(/ç/g, "c")
        .replace(/ğ/g, "g");
    }

    function guessMime(url){
      try{
        const p = new URL(url).pathname.toLowerCase();
        if (p.endsWith(".mp3")) return "audio/mpeg";
        if (p.endsWith(".m4a")) return "audio/mp4";
      }catch{}
      return "audio/*";
    }

    function urlFor(item){
      if (item.url) return item.url;
      const file = item.file || item.name || item.title || "";
      return new URL(file, BASE).toString();
    }

    function fmtDur(sec){
      if (!Number.isFinite(sec) || sec <= 0) return "—";
      sec = Math.round(sec);
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const mm = String(m).padStart(2, "0");
      const ss = String(s).padStart(2, "0");
      if (h > 0) return `${h}:${mm}:${ss}`;
      return `${m}:${ss}`;
    }

    function parseEndDate(item){
      const raw0 = (item.file || item.title || "").toString();
      const lastPart = raw0.split("/").pop() || raw0;

      let s;
      try { s = decodeURIComponent(lastPart); } catch { s = lastPart; }

      s = s.replace(/\.(mp3|m4a|wav|aac|ogg|flac)$/i, "").trim();
      s = s.normalize("NFKC");
      s = s.replace(/\u00A0/g, " ");
      s = s.trim().replace(/[)\]\s]+$/g, "").trim();

      const m = s.match(/(\d{1,2})[.\-_\u00B7](\d{1,2})[.\-_\u00B7](\d{2}|\d{4})\s*$/);
      if (!m) return null;

      const dd = Number(m[1]);
      const mm = Number(m[2]);
      let yy = Number(m[3]);
      if (yy < 100) yy = 2000 + yy;

      if (!(dd >= 1 && dd <= 31 && mm >= 1 && mm <= 12)) return null;

      const t = Date.UTC(yy, mm - 1, dd);
      if (!Number.isFinite(t)) return null;

      const d = new Date(t);
      if (d.getUTCFullYear() !== yy || (d.getUTCMonth() + 1) !== mm || d.getUTCDate() !== dd) return null;

      return t;
    }

    function arrowSvg(isAsc){
      return isAsc
        ? `<path d="M12 19V5"/><path d="M7 10l5-5 5 5"/>`
        : `<path d="M12 5v14"/><path d="M7 14l5 5 5-5"/>`;
    }

    // =========================
    // Duration loader
    // =========================
    const durQueue = [];
    const durLoading = new Set();
    let durActive = 0;
    const DUR_CONCURRENCY = 2;
    let rerenderTimer = null;

    function scheduleRerender(){
      if (rerenderTimer) return;
      rerenderTimer = setTimeout(() => {
        rerenderTimer = null;
        render();
      }, 120);
    }

    function requestDuration(it){
      const id = it.id;
      if (durs[id] > 0) return;
      if (durLoading.has(id)) return;
      durLoading.add(id);
      durQueue.push(it);
      pumpDurationQueue();
    }

    function pumpDurationQueue(){
      while (durActive < DUR_CONCURRENCY && durQueue.length){
        const it = durQueue.shift();
        durActive++;
        loadDurationFor(it).catch(() => {}).finally(() => {
          durActive--;
          pumpDurationQueue();
        });
      }
    }

    function loadDurationFor(it){
      return new Promise((resolve, reject) => {
        const a = new Audio();
        a.preload = "metadata";
        a.src = urlFor(it);

        let done = false;

        const cleanup = () => {
          a.removeEventListener("loadedmetadata", onMeta);
          a.removeEventListener("error", onErr);
          try { a.src = ""; } catch {}
        };

        const finish = (ok, err) => {
          if (done) return;
          done = true;
          cleanup();
          durLoading.delete(it.id);
          ok ? resolve() : reject(err || new Error("metadata error"));
        };

        const onMeta = () => {
          const dur = a.duration;
          if (Number.isFinite(dur) && dur > 0){
            durs[it.id] = dur;
            saveMap(LS.durs, durs);
            scheduleRerender();
          }
          finish(true);
        };

        const onErr = () => finish(false, new Error("metadata error"));

        a.addEventListener("loadedmetadata", onMeta, { once: true });
        a.addEventListener("error", onErr, { once: true });

        setTimeout(() => {
          if (!done) finish(false, new Error("timeout"));
        }, 12000);
      });
    }

    // =========================
    // Archive list fetch + cache
    // =========================
    function makeFingerprint(list){
      return list.map(x => x.file).sort().join("|");
    }

    function loadFromCache(){
      try{
        const raw = localStorage.getItem(LS.cacheItems);
        if(!raw) return false;
        const cached = JSON.parse(raw);
        if(!Array.isArray(cached)) return false;
        items = cached;
        render();
        scheduleRefreshCounts(150);
        return true;
      }catch{ return false; }
    }

    async function fetchFromArchive(){
      const metaUrl = `https://archive.org/metadata/${ARCHIVE_ID}?_=${Date.now()}`;
      const res = await fetch(metaUrl, { cache: "no-store" });
      if(!res.ok) throw new Error("metadata okunamadı");
      const data = await res.json();

      const files = Array.isArray(data.files) ? data.files : [];
      const newItems = files
        .filter(f => {
          const name = (f.name || "").toLowerCase();
          return name.endsWith(".mp3") || name.endsWith(".m4a");
        })
        .map((f, idx) => {
          const file = f.name || "";
          const title =
            (f.title && String(f.title).trim()) ||
            (() => { try { return decodeURIComponent(file.split("/").pop() || file); } catch { return (file.split("/").pop() || file); } })() ||
            ("Kayıt " + (idx + 1));

          const url = `https://archive.org/download/${ARCHIVE_ID}/${encodeURIComponent(file).replace(/%2F/g, "/")}`;
          const id = file || title;
          return { id, title, file, url };
        })
        .sort((a,b) => a.title.localeCompare(b.title, "tr"));

      const fp = makeFingerprint(newItems);
      if (fp === lastFp && items.length) return false;

      items = newItems;
      lastFp = fp;

      localStorage.setItem(LS.cacheFp, fp);
      localStorage.setItem(LS.cacheItems, JSON.stringify(items));

      render();
      scheduleRefreshCounts(150);
      return true;
    }

    async function loadItems(){
      statusEl.textContent = "Yükleniyor...";

      const hadCache = loadFromCache();
      if (hadCache) statusEl.textContent = "Güncelleniyor...";

      try{
        await fetchFromArchive();
        statusEl.textContent = "";
      }catch(err){
        console.error(err);
        statusEl.textContent = hadCache ? "" : "Arşivden kayıtlar çekilemedi.";
      }

      setInterval(() => { fetchFromArchive().catch(() => {}); }, 180000);
    }

    // =========================
    // Filtering + sorting
    // =========================
    function getVisibleItems(){
      const q = normTR((searchEl.value || "").trim());

      let arr = items.filter(it => {
        if (q && !normTR(it.title).includes(q)) return false;
        if (filterFav && !favs[it.id]) return false;
        if (filterSel && !sels[it.id]) return false;
        return true;
      });

      if (sortMode === "dur"){
        const dir = (durSortDir === "asc") ? 1 : -1;
        arr.sort((a,b) => {
          const ha = (durs[a.id] > 0);
          const hb = (durs[b.id] > 0);
          if (ha !== hb) return ha ? -1 : 1;
          if (ha && hb){
            const da = durs[a.id];
            const db = durs[b.id];
            if (da !== db) return (da - db) * dir;
          }
          return a.title.localeCompare(b.title, "tr");
        });
      } else if (sortMode === "date"){
        const dir = (dateSortDir === "asc") ? 1 : -1;
        arr.sort((a,b) => {
          const ta = parseEndDate(a);
          const tb = parseEndDate(b);
          const ha = (ta !== null);
          const hb = (tb !== null);
          if (ha !== hb) return ha ? -1 : 1;
          if (ha && hb && ta !== tb) return (ta - tb) * dir;
          return a.title.localeCompare(b.title, "tr");
        });
      } else if (sortMode === "play"){
        const dir = (playSortDir === "asc") ? 1 : -1;
        arr.sort((a,b) => {
          const ca = Number(globalPlayCounts[a.id]) || 0;
          const cb = Number(globalPlayCounts[b.id]) || 0;
          if (ca !== cb) return (ca - cb) * dir;
          return a.title.localeCompare(b.title, "tr");
        });
      } else if (sortMode === "download"){
        const dir = (dlSortDir === "asc") ? 1 : -1;
        arr.sort((a,b) => {
          const ca = Number(globalDownloadCounts[a.id]) || 0;
          const cb = Number(globalDownloadCounts[b.id]) || 0;
          if (ca !== cb) return (ca - cb) * dir;
          return a.title.localeCompare(b.title, "tr");
        });
      } else {
        arr.sort((a,b) => a.title.localeCompare(b.title, "tr"));
      }

      return arr;
    }

    function render(){
      const visible = getVisibleItems();
      metaEl.textContent = `Görünən: ${visible.length} / Toplam: ${items.length}`;

      filterFavBtn.classList.toggle("on", filterFav);
      filterSelBtn.classList.toggle("on", filterSel);
      filterFavBtn.setAttribute("aria-pressed",  String(filterFav));
      filterSelBtn.setAttribute("aria-pressed",  String(filterSel));

      listEl.innerHTML = "";

      const toMeasure = (sortMode === "dur") ? items : visible;
      for (const it of toMeasure){
        if (!(durs[it.id] > 0)) requestDuration(it);
      }

      for (const it of visible){
        const row = document.createElement("div");
        row.className = "itemRow" + (it.id === activeId ? " active" : "");

        const title = document.createElement("div");
        title.className = "title";
        title.innerHTML = highlightDisease(it.title);

        const dur = document.createElement("div");
        dur.className = "dur";
        dur.textContent = (durs[it.id] > 0) ? fmtDur(durs[it.id]) : "…";

        const playCount = document.createElement("div");
        playCount.className = "countCell";
        playCount.textContent = String(Number(globalPlayCounts[it.id]) || 0);

        const favBtn = iconButton("star", !!favs[it.id], "Favori");
        const selBtn = iconButton("check", !!sels[it.id], "Seç");
        const dlBtn  = iconButton("download", false, "İndir");

        const dlCount = document.createElement("div");
        dlCount.className = "countCell";
        dlCount.textContent = String(Number(globalDownloadCounts[it.id]) || 0);

        favBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          favs[it.id] = !favs[it.id];
          saveMap(LS.favs, favs);
          render();
        });

        selBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          sels[it.id] = !sels[it.id];
          saveMap(LS.sels, sels);
          render();
        });

        dlBtn.addEventListener("click", (e) => {
          e.stopPropagation();

          bumpLocalGlobalCount("download", it.id);
          sendHit("download", it);
          scheduleRefreshCounts(1200);

          const fileUrl = urlFor(it);
          const dlUrl = DL_PROXY + "?u=" + encodeURIComponent(fileUrl);
          window.location.href = dlUrl;
        });

        for (const b of [favBtn, selBtn, dlBtn]){
          b.addEventListener("pointerup", (e) => e.stopPropagation());
          b.addEventListener("pointerdown", (e) => e.stopPropagation());
        }

        row.appendChild(title);
        row.appendChild(dur);
        row.appendChild(playCount);
        row.appendChild(favBtn);
        row.appendChild(selBtn);
        row.appendChild(dlBtn);
        row.appendChild(dlCount);

        row.addEventListener("click", () => playById(it.id));
        listEl.appendChild(row);
      }

      const cur = (statusEl.textContent || "").trim();
      if (counterStatus){
        if (!cur || cur.startsWith("Sayaç")) statusEl.textContent = counterStatus;
      } else {
        if (cur.startsWith("Sayaç")) statusEl.textContent = "";
      }
    }

    function iconButton(kind, on, title){
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "iconBtn" + (on ? " on" : "");
      btn.title = title;
      btn.dataset.kind = kind;

      if (kind === "star"){
        btn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="${on ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2">
            <path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1L12 2z"/>
          </svg>`;
      } else if (kind === "check"){
        btn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 6L9 17l-5-5"/>
          </svg>`;
      } else if (kind === "download"){
        btn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3v12"/>
            <path d="M7 10l5 5 5-5"/>
            <path d="M5 21h14"/>
          </svg>`;
      }
      return btn;
    }

    // =========================
    // Playback
    // =========================
    function playById(id){
      const visible = getVisibleItems();
      const idx = visible.findIndex(x => x.id === id);
      if (idx === -1) return;
      playAtVisibleIndex(idx);
    }

    function playAtVisibleIndex(idx){
      const visible = getVisibleItems();
      const it = visible[idx];
      if (!it) return;

      armPlayGate(it);

      statusEl.textContent = "";
      activeId = it.id;
      fpTitle.textContent = it.title;
      render();

      const url = urlFor(it);
      const mime = guessMime(url);

      plyr.source = {
        type: "audio",
        title: it.title,
        sources: [{ src: url, type: mime }]
      };

      const currentSpeed = SPEEDS[speedIndex] || 1;

      const tryPlay = () => {
        plyr.speed = currentSpeed;
        const p = plyr.play();
        if (p && typeof p.catch === "function"){
          p.catch(() => {
            statusEl.textContent = "Oynatma başlatılamadı. Player’daki ▶︎ tuşuna bas.";
          });
        }
      };

      const onCanPlay = () => {
        playerEl.removeEventListener("canplay", onCanPlay);
        setTimeout(tryPlay, 50);
      };

      playerEl.addEventListener("canplay", onCanPlay);
      setTimeout(() => { if (playerEl.paused) tryPlay(); }, 600);
    }

    function playPrev(){
      const visible = getVisibleItems();
      if (!visible.length) return;
      let idx = visible.findIndex(x => x.id === activeId);
      if (idx === -1) idx = 0;
      idx = (idx - 1 + visible.length) % visible.length;
      playAtVisibleIndex(idx);
    }

    function playNext(){
      const visible = getVisibleItems();
      if (!visible.length) return;
      let idx = visible.findIndex(x => x.id === activeId);
      if (idx === -1) idx = 0;
      idx = (idx + 1) % visible.length;
      playAtVisibleIndex(idx);
    }

    prevBtn.addEventListener("click", playPrev);
    nextBtn.addEventListener("click", playNext);
    plyr.on("ended", () => { setTimeout(() => playNext(), 0); });

    document.addEventListener("keydown", (e) => {
      const tag = (document.activeElement && document.activeElement.tagName || "").toLowerCase();
      const inTyping = (tag === "input" || tag === "textarea");
      if (inTyping) return;

      if (e.code === "Space"){
        e.preventDefault();
        plyr.togglePlay();
      } else if (e.code === "ArrowLeft"){
        e.preventDefault();
        playPrev();
      } else if (e.code === "ArrowRight"){
        e.preventDefault();
        playNext();
      }
    });

    // Filters
    filterFavBtn.addEventListener("click", () => { filterFav = !filterFav; render(); });
    filterSelBtn.addEventListener("click", () => { filterSel = !filterSel; render(); });

    resetBtn.addEventListener("click", () => {
      filterFav = false;
      filterSel = false;
      searchEl.value = "";

      sortMode = "title";
      localStorage.setItem(LS.sortMode, sortMode);

      setSortIcons();
      render();
    });

    let searchTimer = null;
    searchEl.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => render(), 90);
    });

    // =========================
    // DRAGGABLE PLAYER + clamp (zoom uyumlu)
    // =========================
    function restorePlayerPos(){
      try{
        const s = JSON.parse(localStorage.getItem(LS.pos) || "null");
        if (!s) return;
        if (typeof s.x === "number" && typeof s.y === "number"){
          fp.style.left = s.x + "px";
          fp.style.top = s.y + "px";
          fp.style.bottom = "auto";
          fp.style.right = "auto";
        }
      }catch{}
    }

    function savePlayerPos(x,y){
      localStorage.setItem(LS.pos, JSON.stringify({x,y}));
    }

    function getViewportWH(){
      const vv = window.visualViewport;
      const vw = (vv && vv.width)  ? vv.width  : window.innerWidth;
      const vh = (vv && vv.height) ? vv.height : window.innerHeight;
      return { vw, vh };
    }

    function clampPlayerToViewport(){
      const { vw, vh } = getViewportWH();

      const w0 = fp.offsetWidth;
      const h0 = fp.offsetHeight;
      const w = useTransformScale ? (w0 * uiScale) : w0;
      const h = useTransformScale ? (h0 * uiScale) : h0;

      const minX = 8;
      const minY = 8;
      const maxX = Math.max(minX, vw - w - 8);
      const maxY = Math.max(minY, vh - h - 8);

      const left = parseFloat(fp.style.left);
      const top  = parseFloat(fp.style.top);
      if (!Number.isFinite(left) || !Number.isFinite(top)) return;

      const nx = Math.min(maxX, Math.max(minX, left));
      const ny = Math.min(maxY, Math.max(minY, top));

      fp.style.left = nx + "px";
      fp.style.top  = ny + "px";
      fp.style.right = "auto";
      fp.style.bottom = "auto";

      savePlayerPos(nx, ny);
    }

    const DRAG_IGNORE_SELECTOR =
      "button, a, input, textarea, select, option, " +
      ".speedWrap, .speedCtlBtn, .miniBtn, " +
      ".plyr__controls, .plyr__control, .plyr__progress, .plyr__seek, .plyr__volume, .plyr__time, .plyr__menu";

    function shouldStartDrag(target){
      return !(target && target.closest && target.closest(DRAG_IGNORE_SELECTOR));
    }

    let dragging = false;
    let startX = 0, startY = 0, startLeft = 0, startTop = 0;
    let moved = false;
    let suppressClickUntil = 0;

    fp.addEventListener("pointerdown", (e) => {
      if (!shouldStartDrag(e.target)) return;

      dragging = true;
      moved = false;

      fp.setPointerCapture(e.pointerId);
      fpHeader.style.cursor = "grabbing";

      const rect = fp.getBoundingClientRect();
      startX = e.clientX;
      startY = e.clientY;
      startLeft = rect.left;
      startTop = rect.top;

      fp.style.left = startLeft + "px";
      fp.style.top = startTop + "px";
      fp.style.bottom = "auto";
      fp.style.right = "auto";
    });

    fp.addEventListener("pointermove", (e) => {
      if (!dragging) return;

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (!moved && (Math.abs(dx) + Math.abs(dy) > 6)) moved = true;

      const w0 = fp.offsetWidth;
      const h0 = fp.offsetHeight;
      const w = useTransformScale ? (w0 * uiScale) : w0;
      const h = useTransformScale ? (h0 * uiScale) : h0;

      const { vw, vh } = getViewportWH();

      const minX = 8;
      const minY = 8;
      const maxX = Math.max(minX, vw - w - 8);
      const maxY = Math.max(minY, vh - h - 8);

      const nx = Math.min(maxX, Math.max(minX, startLeft + dx));
      const ny = Math.min(maxY, Math.max(minY, startTop + dy));

      fp.style.left = nx + "px";
      fp.style.top = ny + "px";

      savePlayerPos(nx, ny);
    });

    function endDrag(pointerId){
      if (!dragging) return;
      dragging = false;
      fpHeader.style.cursor = "grab";

      try { fp.releasePointerCapture(pointerId); } catch {}
      clampPlayerToViewport();

      if (moved){
        suppressClickUntil = Date.now() + 350;
        moved = false;
      }
    }

    fp.addEventListener("pointerup", (e) => endDrag(e.pointerId));
    fp.addEventListener("pointercancel", (e) => endDrag(e.pointerId));

    fp.addEventListener("click", (e) => {
      if (Date.now() < suppressClickUntil){
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);

    window.addEventListener("resize", () => clampPlayerToViewport());
    window.addEventListener("orientationchange", () => setTimeout(clampPlayerToViewport, 150));
    if (window.visualViewport){
      window.visualViewport.addEventListener("resize", () => clampPlayerToViewport());
    }

    // NAV ACTIVE
    (function setActiveNav(){
      const here = location.href.replace(/\/$/, "");
      document.querySelectorAll(".navRow .navLink").forEach(a => {
        a.classList.remove("on");
        const u = (a.getAttribute("href") || "").replace(/\/$/, "");
        if (!u) return;
        if (here === u || here.startsWith(u + "/")) a.classList.add("on");
      });
    })();

    // Boot
    setSortIcons();
    restorePlayerPos();
    restoreSpeed();
    restoreZoom();
    setTimeout(clampPlayerToViewport, 0);
    loadItems();
  </script>
</body>
</html>
