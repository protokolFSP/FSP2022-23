<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>2021–23 Alfabetik FSP A–Z</title>

  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

  <style>
    :root{
      --border:#e9e9e9;
      --muted:#6b6b6b;
      --bg:#ffffff;
      --hover:#f7f7f7;

      --active:#cfe9ff;
      --activeGlow: 0 0 0 2px rgba(43,124,255,.34) inset, 0 12px 26px rgba(43,124,255,.14);

      --shadow: 0 12px 30px rgba(0,0,0,.12);
      --blue:#2b7cff;
    }

    body{
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 18px;
      max-width: 980px;
      color:#111;
      background: var(--bg);
      line-height: 1.10;
    }

    /* ✅ Transform fallback wrapper */
    #appScale{
      transform-origin: top left;
      will-change: transform;
    }

    h1{
      font-size: 1.55rem;
      margin: 0 0 12px 0;
      font-weight: 650;
      letter-spacing: .2px;
    }

    .pageTitle{
      font-size: 1.6rem;
      font-weight: 700;
      color: #0b5fff;
      background: #f1f5ff;
      padding: 12px 16px;
      border-radius: 14px;
      margin-bottom: 14px;
    }

    /* ✅ NAV */
    .navRow{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap: wrap;
      margin: 0 0 12px 0;
    }
    .navLink{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid #d8d8d8;
      background: white;
      color:#111;
      text-decoration:none;
      font-size: .95rem;
      line-height: 1;
      user-select:none;
      transition: background .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .navLink:hover{ background: var(--hover); }
    .navLink.on{
      border-color:#2b7cff;
      background: rgba(43,124,255,.10);
      box-shadow: 0 0 0 3px rgba(43,124,255,.16) inset;
    }

    .topbar{
      display:flex;
      gap:10px;
      align-items:center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    #search{
      flex: 1 1 520px;
      min-width: 220px;
      padding: 10px 12px;
      border: 1px solid #d8d8d8;
      border-radius: 14px;
      font-size: 1rem;
      outline: none;
    }

    #resetBtn{
      padding: 10px 16px;
      border: 1px solid #d8d8d8;
      border-radius: 14px;
      background: white;
      cursor: pointer;
      font-size: 1rem;
      flex: 0 0 auto;
    }
    #resetBtn:hover{ background: var(--hover); }

    /* ✅ Safari-like zoom: iki A + double tap reset */
    .zoomWrap{
      display:flex;
      align-items:center;
      gap: 6px;
      padding: 4px;
      border: 1px solid #d8d8d8;
      border-radius: 14px;
      background: white;
      user-select:none;
      flex: 0 0 auto;
    }
    .zoomBtn{
      height: 36px;
      width: 40px;
      border-radius: 12px;
      border: 1px solid #d8d8d8;
      background: white;
      cursor: pointer;
      font-weight: 900;
      line-height: 1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .zoomBtn:hover{ background: var(--hover); }
    .zoomBtn:disabled{ opacity: .45; cursor: default; }
    .zoomSmall{ font-size: 16px; }
    .zoomLarge{ font-size: 22px; }

    #meta{
      color: var(--muted);
      font-size: .95rem;
      margin: 6px 0 12px 2px;
      line-height: 1.05;
    }

    /* ✅ Grid: Kayıt | Süre | ⭐ | ✓ | ⬇︎ */
    .headerRow, .itemRow{
      display: grid;
      grid-template-columns: minmax(0, 1fr) 8ch 36px 36px 36px;
      align-items: center;
      column-gap: 8px;
    }

    .headerRow{
      padding: 6px 8px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.05;
    }

    .titleHead, .durHead{
      display:flex;
      align-items:center;
      gap:8px;
      user-select:none;
      width: 100%;
    }
    .titleHead{ justify-content:flex-start; }
    .durHead{ justify-content:flex-end; }

    .headIconCell{
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
    }

    .sortBtn{
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid #d8d8d8;
      background: white;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      color:#111;
      flex: 0 0 auto;
    }
    .sortBtn:hover{ background: var(--hover); }
    .sortBtn svg{ width:14px; height:14px; }
    .sortBtn.on{
      border-color:#2b7cff;
      box-shadow: 0 0 0 3px rgba(43,124,255,.12) inset;
    }

    #list{
      border-bottom: 1px solid var(--border);
    }

    /* ✅ Zebra */
    .itemRow{
      padding: 4px 8px;
      border-bottom: 1px solid #ececec;
      cursor: pointer;
      background: #f7f7f7;
    }
    #list .itemRow:nth-child(even){
      background: #eeeeee;
    }
    .itemRow:hover{
      background: var(--hover);
    }

    .itemRow.active{
      background: var(--active) !important;
      box-shadow: var(--activeGlow);
      position: relative;
    }
    .itemRow.active:hover{
      background: var(--active) !important;
    }
    .itemRow.active::before{
      content:"";
      position:absolute;
      left:0;
      top:0;
      bottom:0;
      width:4px;
      background: var(--blue);
      border-radius: 4px;
    }

    .title{
      font-size: 1.02rem;
      font-weight: 500;
      line-height: 1.02;
      min-width: 0;
    }

    .dur{
      text-align:right;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: .95rem;
      user-select:none;
      white-space: nowrap;
      line-height: 1.00;
    }

    @media (max-width: 680px){
      body{ margin: 14px; }
      .headerRow, .itemRow{ grid-template-columns: minmax(0, 1fr) 8ch 36px 36px 36px; }
      .title{
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #search{ flex: 1 1 100%; }
    }

    .iconBtn{
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid #d8d8d8;
      background: white;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor: pointer;
      flex: 0 0 auto;
      user-select:none;
      justify-self: center;
    }
    .iconBtn:hover{ background: var(--hover); }
    .iconBtn.on{
      border-color: #2b7cff;
      box-shadow: 0 0 0 3px rgba(43,124,255,.12) inset;
    }
    .iconBtn svg{ width: 14px; height: 14px; opacity: .9; }

    .filterBtn{
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid #d8d8d8;
      background: white;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      color:#111;
    }
    .filterBtn:hover{ background: var(--hover); }
    .filterBtn.on{
      border-color:#2b7cff;
      box-shadow: 0 0 0 3px rgba(43,124,255,.12) inset;
    }
    .filterBtn svg{ width:14px; height:14px; }

    /* ✅ Floating player */
    #floatingPlayer{
      position: fixed;
      left: max(18px, env(safe-area-inset-left));
      bottom: max(18px, env(safe-area-inset-bottom));
      width: min(720px, calc(100vw - 36px));
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      z-index: 9999;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
      transform-origin: top left;
      will-change: transform;
    }

    #fpHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 10px 12px;
      border-bottom: 1px solid #f0f0f0;
      background: #fbfbfb;
      cursor: grab;
      user-select:none;
      gap: 10px;
      touch-action: none;
    }

    #fpTitle{
      font-weight: 600;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1 1 auto;
      min-width: 0;
      line-height: 1.05;
    }

    #fpHeaderRight{
      display:flex;
      align-items:center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .miniBtn{
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid #d8d8d8;
      background: white;
      cursor: pointer;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .miniBtn:hover{ background: var(--hover); }
    .miniBtn svg{ width:16px; height:16px; }

    .speedWrap{
      display:flex;
      align-items:center;
      gap: 6px;
      padding: 4px;
      border: 1px solid #d8d8d8;
      border-radius: 14px;
      background: white;
      user-select:none;
    }
    .speedCtlBtn{
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid #d8d8d8;
      background: white;
      cursor: pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 18px;
      line-height: 1;
    }
    .speedCtlBtn:hover{ background: var(--hover); }

    .speedValue{
      min-width: 56px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid #d8d8d8;
      background: white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      padding: 0 10px;
      cursor: default;
    }
    .speedValue.on{
      border-color:#2b7cff;
      box-shadow: 0 0 0 3px rgba(43,124,255,.12) inset;
    }

    #fpBody{
      padding: 10px 12px 12px 12px;
    }

    #status{
      margin: 8px 2px 0 2px;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.05;
    }

    .plyr--audio .plyr__controls{
      border-radius: 12px;
      flex-wrap: wrap;
      row-gap: 8px;
    }
    .plyr--audio .plyr__controls .plyr__progress{
      flex: 1 1 100%;
      min-width: 0;
    }

    @media (max-width: 680px){
      #fpHeader{ flex-wrap: wrap; gap: 8px; }
      #fpTitle{
        flex: 1 1 100%;
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
      }
      #fpHeaderRight{
        width: 100%;
        justify-content: flex-end;
      }
    }

    .diseaseName{
      color: #c2410c;
      font-weight: 650;
    }
  </style>
</head>

<body>
  <div id="appScale">
    <h1 class="pageTitle">Alfabetik 2021–23 FSP A–Z</h1>

    <nav class="navRow" aria-label="Sayfalar">
      <a class="navLink" href="https://protokolfsp.github.io/fsp-audio/">Güncel</a>
      <a class="navLink" href="https://protokolfsp.github.io/FSP2022-23/">2021–23</a>
      <a class="navLink" href="https://protokolfsp.github.io/All-in-One/">All-in-One</a>
    </nav>

    <div class="topbar">
      <input id="search" type="text" placeholder="Arama (ör. ACS, DM, PAVK)..." />
      <button id="resetBtn" type="button">Hepsi</button>

      <div class="zoomWrap" aria-label="Görünüm">
        <button id="zoomOutBtn" class="zoomBtn zoomSmall" type="button" aria-label="Küçült">A</button>
        <button id="zoomInBtn" class="zoomBtn zoomLarge" type="button" aria-label="Büyüt">A</button>
      </div>
    </div>

    <div id="meta">Görünən: 0 / Toplam: 0</div>

    <div class="headerRow">
      <div class="colTitle">
        <div class="titleHead">
          <span>Kayıt</span>
          <button id="sortDateBtn" class="sortBtn" type="button" title="Tarihe göre sırala (dosya sonu)">
            <svg id="sortDateIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14"/><path d="M7 14l5 5 5-5"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="colDur" style="text-align:right;">
        <div class="durHead">
          <span>Süre</span>
          <button id="sortDurBtn" class="sortBtn" type="button" title="Süreye göre sırala">
            <svg id="sortDurIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14"/><path d="M7 14l5 5 5-5"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="headIconCell">
        <button id="filterFav" class="filterBtn" title="Favoriler filtrele" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1L12 2z"/>
          </svg>
        </button>
      </div>

      <div class="headIconCell">
        <button id="filterSel" class="filterBtn" title="Seçilenler filtrele" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </button>
      </div>

      <div class="headIconCell" aria-hidden="true"></div>
    </div>

    <div id="list"></div>
    <div id="status"></div>
  </div>

  <div id="floatingPlayer" role="region" aria-label="Oynatıcı">
    <div id="fpHeader" title="Sürükle">
      <div id="fpTitle">Bir kayıt seç...</div>
      <div id="fpHeaderRight">
        <div id="speedWrap" class="speedWrap" aria-label="Hız">
          <button id="slowBtn" class="speedCtlBtn" type="button" title="Yavaşlat (🐢)">🐢</button>
          <div id="speedValue" class="speedValue on" title="Oynatma hızı">1×</div>
          <button id="fastBtn" class="speedCtlBtn" type="button" title="Hızlandır (🐇)">🐇</button>
        </div>

        <button id="prevBtn" class="miniBtn" type="button" title="Önceki">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 20L9 12l10-8v16z"/><path d="M5 19V5"/>
          </svg>
        </button>
        <button id="nextBtn" class="miniBtn" type="button" title="Sonraki">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 4l10 8-10 8V4z"/><path d="M19 5v14"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="fpBody">
      <audio id="player" class="js-player" controls preload="metadata"></audio>
    </div>
  </div>

  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

  <script>
    // =========================
    // Archive source
    // =========================
    const ARCHIVE_ID = "FSP21_23";
    const BASE = `https://archive.org/download/${ARCHIVE_ID}/`;
    const DL_PROXY = "https://fspdownload.protokolfsp.workers.dev/";

    // =========================
    // DOM
    // =========================
    const listEl   = document.getElementById("list");
    const searchEl = document.getElementById("search");
    const metaEl   = document.getElementById("meta");
    const statusEl = document.getElementById("status");

    const appScaleEl = document.getElementById("appScale");
    const zoomOutBtn = document.getElementById("zoomOutBtn");
    const zoomInBtn  = document.getElementById("zoomInBtn");

    const fp = document.getElementById("floatingPlayer");
    const fpHeader = document.getElementById("fpHeader");
    const fpTitle = document.getElementById("fpTitle");

    const playerEl = document.getElementById("player");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    const slowBtn = document.getElementById("slowBtn");
    const fastBtn = document.getElementById("fastBtn");
    const speedValueEl = document.getElementById("speedValue");

    const filterFavBtn  = document.getElementById("filterFav");
    const filterSelBtn  = document.getElementById("filterSel");
    const resetBtn      = document.getElementById("resetBtn");

    const sortDurBtn  = document.getElementById("sortDurBtn");
    const sortDurIcon = document.getElementById("sortDurIcon");
    const sortDateBtn  = document.getElementById("sortDateBtn");
    const sortDateIcon = document.getElementById("sortDateIcon");

    const plyr = new Plyr(playerEl, {
      seekTime: 5,
      controls: ["rewind","play","fast-forward","progress","current-time","duration","mute","volume"]
    });

    // =========================
    // LocalStorage keys
    // =========================
    const LS = {
      favs:  "fsp.favs.v1",
      sels:  "fsp.sels.v1",
      pos:   "fsp.fp.pos.v1",
      durs:  "fsp.durs.v1",
      sortMode: "fsp.sort.mode.v2",
      sortDirDur: "fsp.sort.dur.dir.v2",
      sortDirDate: "fsp.sort.date.dir.v2",
      cacheItems: `fsp.cache.items.${ARCHIVE_ID}.v1`,
      cacheFp:    `fsp.cache.fp.${ARCHIVE_ID}.v1`,
      speed: "fsp.speed.v1",
      zoom:  `fsp.ui.zoom.${ARCHIVE_ID}.v1`
    };

    const loadMap = (k) => { try { return JSON.parse(localStorage.getItem(k) || "{}"); } catch { return {}; } };
    const saveMap = (k, v) => localStorage.setItem(k, JSON.stringify(v));

    let favs  = loadMap(LS.favs);
    let sels  = loadMap(LS.sels);
    let durs  = loadMap(LS.durs);

    let filterFav  = false;
    let filterSel  = false;

    let items = [];
    let activeId = null;

    let sortMode = localStorage.getItem(LS.sortMode) || "title";
    let durSortDir  = (localStorage.getItem(LS.sortDirDur) === "desc") ? "desc" : "asc";
    let dateSortDir = (localStorage.getItem(LS.sortDirDate) === "desc") ? "desc" : "asc";

    let lastFp = localStorage.getItem(LS.cacheFp) || "";

    // =========================
    // SPEED
    // =========================
    const SPEEDS = [0.5, 0.75, 0.9, 1, 1.25, 1.5, 1.75];
    let speedIndex = SPEEDS.indexOf(1);

    function fmtSpeed(v){
      const s = (Math.round(v * 100) / 100).toString();
      return s.replace(/\.0+$/,"") + "×";
    }

    function setSpeedUI(v){
      speedValueEl.textContent = fmtSpeed(v);
      speedValueEl.classList.add("on");
      slowBtn.disabled = (speedIndex <= 0);
      fastBtn.disabled = (speedIndex >= SPEEDS.length - 1);
      slowBtn.style.opacity = slowBtn.disabled ? 0.45 : 1;
      fastBtn.style.opacity = fastBtn.disabled ? 0.45 : 1;
    }

    function applySpeedByIndex(idx){
      speedIndex = Math.max(0, Math.min(SPEEDS.length - 1, idx));
      const v = SPEEDS[speedIndex];
      plyr.speed = v;
      localStorage.setItem(LS.speed, String(v));
      setSpeedUI(v);
    }

    function restoreSpeed(){
      const saved = Number(localStorage.getItem(LS.speed) || "1");
      if (Number.isFinite(saved)){
        const i = SPEEDS.findIndex(x => Math.abs(x - saved) < 0.001);
        applySpeedByIndex(i === -1 ? SPEEDS.indexOf(1) : i);
      } else {
        applySpeedByIndex(SPEEDS.indexOf(1));
      }
    }

    slowBtn.addEventListener("click", (e) => { e.stopPropagation(); applySpeedByIndex(speedIndex - 1); });
    fastBtn.addEventListener("click", (e) => { e.stopPropagation(); applySpeedByIndex(speedIndex + 1); });

    // =========================
    // ZOOM (% görünüm) - player dahil + double tap reset
    // =========================
    const ZOOMS = [0.85, 0.9, 0.95, 1, 1.05, 1.1, 1.15, 1.2];
    let zoomIndex = ZOOMS.indexOf(1);
    let uiScale = 1;
    let useTransformScale = false;

    function setZoomUI(v){
      const pct = Math.round(v * 100) + "%";
      zoomOutBtn.disabled = (zoomIndex <= 0);
      zoomInBtn.disabled = (zoomIndex >= ZOOMS.length - 1);
      zoomOutBtn.title = `Küçült (${pct})`;
      zoomInBtn.title  = `Büyüt (${pct})`;
      zoomOutBtn.setAttribute("aria-label", `Küçült (${pct})`);
      zoomInBtn.setAttribute("aria-label", `Büyüt (${pct})`);
    }

    function applyZoomByIndex(idx){
      zoomIndex = Math.max(0, Math.min(ZOOMS.length - 1, idx));
      const v = ZOOMS[zoomIndex];
      uiScale = v;

      useTransformScale = !(window.CSS && CSS.supports && CSS.supports("zoom", "1"));

      if (!useTransformScale){
        document.documentElement.style.zoom = String(v);
        appScaleEl.style.transform = "";
        fp.style.transform = "";
      } else {
        document.documentElement.style.zoom = "";
        appScaleEl.style.transform = `scale(${v})`;
        fp.style.transform = `scale(${v})`;
      }

      localStorage.setItem(LS.zoom, String(v));
      setZoomUI(v);
      setTimeout(() => clampPlayerToViewport(), 0);
    }

    function restoreZoom(){
      const saved = Number(localStorage.getItem(LS.zoom) || "1");
      if (Number.isFinite(saved)){
        const i = ZOOMS.findIndex(x => Math.abs(x - saved) < 0.001);
        applyZoomByIndex(i === -1 ? ZOOMS.indexOf(1) : i);
      } else {
        applyZoomByIndex(ZOOMS.indexOf(1));
      }
    }

    function resetZoom100(){
      applyZoomByIndex(ZOOMS.indexOf(1));
    }

    function attachDoubleTapReset(el){
      el.addEventListener("dblclick", (e) => { e.preventDefault(); resetZoom100(); });

      let lastTap = 0;
      el.addEventListener("touchend", (e) => {
        const now = Date.now();
        if (now - lastTap < 320){
          e.preventDefault();
          resetZoom100();
          lastTap = 0;
          return;
        }
        lastTap = now;
      }, { passive: false });
    }

    zoomOutBtn.addEventListener("click", (e) => { e.stopPropagation(); applyZoomByIndex(zoomIndex - 1); });
    zoomInBtn.addEventListener("click", (e) => { e.stopPropagation(); applyZoomByIndex(zoomIndex + 1); });
    attachDoubleTapReset(zoomOutBtn);
    attachDoubleTapReset(zoomInBtn);

    // =========================
    // Helpers
    // =========================
    function escHtml(s){
      return (s ?? "").toString()
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;");
    }

    // ✅ Dr/dr veya Fr/fr (noktalı/noktası) öncesi
    function highlightDisease(title){
      const raw = (title ?? "").toString();
      const m = raw.match(/\b(dr|fr)\b\.?/i);
      if (!m || m.index == null) return escHtml(raw);

      const i = m.index;
      const leftRaw = raw.slice(0, i);
      const leftTrim = leftRaw.trimEnd();
      if (!leftTrim.trim()) return escHtml(raw);

      const trailing = leftRaw.slice(leftTrim.length);
      return `<span class="diseaseName">${escHtml(leftTrim)}</span>${escHtml(trailing)}${escHtml(raw.slice(i))}`;
    }

    function normTR(s){
      return (s || "")
        .toLocaleLowerCase("tr")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/ı/g, "i")
        .replace(/İ/g, "i")
        .replace(/ü/g, "u")
        .replace(/ö/g, "o")
        .replace(/ş/g, "s")
        .replace(/ç/g, "c")
        .replace(/ğ/g, "g");
    }

    function guessMime(url){
      try{
        const p = new URL(url).pathname.toLowerCase();
        if (p.endsWith(".mp3")) return "audio/mpeg";
        if (p.endsWith(".m4a")) return "audio/mp4";
      }catch{}
      return "audio/*";
    }

    function urlFor(item){
      if (item.url) return item.url;
      const file = item.file || item.name || item.title || "";
      return new URL(file, BASE).toString();
    }

    function fmtDur(sec){
      if (!Number.isFinite(sec) || sec <= 0) return "—";
      sec = Math.round(sec);
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const mm = String(m).padStart(2, "0");
      const ss = String(s).padStart(2, "0");
      if (h > 0) return `${h}:${mm}:${ss}`;
      return `${m}:${ss}`;
    }

    function parseEndDate(item){
      const raw0 = (item.file || item.title || "").toString();
      const lastPart = raw0.split("/").pop() || raw0;

      let s;
      try { s = decodeURIComponent(lastPart); } catch { s = lastPart; }

      s = s.replace(/\.(mp3|m4a|wav|aac|ogg|flac)$/i, "").trim();
      s = s.normalize("NFKC").replace(/\u00A0/g, " ").trim();
      s = s.trim().replace(/[)\]\s]+$/g, "").trim();

      const m = s.match(/(\d{1,2})[.\-_\u00B7](\d{1,2})[.\-_\u00B7](\d{2}|\d{4})\s*$/);
      if (!m) return null;

      const dd = Number(m[1]);
      const mm = Number(m[2]);
      let yy = Number(m[3]);
      if (yy < 100) yy = 2000 + yy;

      if (!(dd >= 1 && dd <= 31 && mm >= 1 && mm <= 12)) return null;

      const t = Date.UTC(yy, mm - 1, dd);
      if (!Number.isFinite(t)) return null;

      const d = new Date(t);
      if (d.getUTCFullYear() !== yy || (d.getUTCMonth() + 1) !== mm || d.getUTCDate() !== dd) return null;

      return t;
    }

    function arrowSvg(isAsc){
      return isAsc
        ? `<path d="M12 19V5"/><path d="M7 10l5-5 5 5"/>`
        : `<path d="M12 5v14"/><path d="M7 14l5 5 5-5"/>`;
    }

    // =========================
    // Duration loader (timeout cleanup fix)
    // =========================
    const durQueue = [];
    const durLoading = new Set();
    let durActive = 0;
    const DUR_CONCURRENCY = 2;
    let rerenderTimer = null;

    function scheduleRerender(){
      if (rerenderTimer) return;
      rerenderTimer = setTimeout(() => {
        rerenderTimer = null;
        render();
      }, 120);
    }

    function requestDuration(it){
      const id = it.id;
      if (durs[id] > 0) return;
      if (durLoading.has(id)) return;
      durLoading.add(id);
      durQueue.push(it);
      pumpDurationQueue();
    }

    function pumpDurationQueue(){
      while (durActive < DUR_CONCURRENCY && durQueue.length){
        const it = durQueue.shift();
        durActive++;
        loadDurationFor(it).catch(() => {}).finally(() => {
          durActive--;
          pumpDurationQueue();
        });
      }
    }

    function loadDurationFor(it){
      return new Promise((resolve, reject) => {
        const a = new Audio();
        a.preload = "metadata";
        a.src = urlFor(it);

        let done = false;

        const cleanup = () => {
          a.removeEventListener("loadedmetadata", onMeta);
          a.removeEventListener("error", onErr);
          try { a.src = ""; } catch {}
        };

        const finish = (ok, err) => {
          if (done) return;
          done = true;
          cleanup();
          durLoading.delete(it.id);
          ok ? resolve() : reject(err || new Error("metadata error"));
        };

        const onMeta = () => {
          const dur = a.duration;
          if (Number.isFinite(dur) && dur > 0){
            durs[it.id] = dur;
            saveMap(LS.durs, durs);
            scheduleRerender();
          }
          finish(true);
        };

        const onErr = () => finish(false, new Error("metadata error"));

        a.addEventListener("loadedmetadata", onMeta, { once: true });
        a.addEventListener("error", onErr, { once: true });

        setTimeout(() => {
          if (!done) finish(false, new Error("timeout"));
        }, 12000);
      });
    }

    // =========================
    // Archive list fetch + cache
    // =========================
    function makeFingerprint(list){
      return list.map(x => x.file).sort().join("|");
    }

    function loadFromCache(){
      try{
        const raw = localStorage.getItem(LS.cacheItems);
        if(!raw) return false;
        const cached = JSON.parse(raw);
        if(!Array.isArray(cached)) return false;
        items = cached;
        render();
        return true;
      }catch{ return false; }
    }

    async function fetchFromArchive(){
      const metaUrl = `https://archive.org/metadata/${ARCHIVE_ID}?_=${Date.now()}`;
      const res = await fetch(metaUrl, { cache: "no-store" });
      if(!res.ok) throw new Error("metadata okunamadı");
      const data = await res.json();

      const files = Array.isArray(data.files) ? data.files : [];
      const newItems = files
        .filter(f => {
          const name = (f.name || "").toLowerCase();
          return name.endsWith(".mp3") || name.endsWith(".m4a");
        })
        .map((f, idx) => {
          const file = f.name || "";
          const title =
            (f.title && String(f.title).trim()) ||
            (decodeURIComponent(file.split("/").pop() || file) || "") ||
            ("Kayıt " + (idx + 1));

          const url = `https://archive.org/download/${ARCHIVE_ID}/${encodeURIComponent(file).replace(/%2F/g, "/")}`;
          const id = file || (title + "#" + idx);
          return { id, title, file, url };
        })
        .sort((a,b) => a.title.localeCompare(b.title, "tr"));

      const fp2 = makeFingerprint(newItems);
      if (fp2 === lastFp && items.length) return false;

      items = newItems;
      lastFp = fp2;

      localStorage.setItem(LS.cacheFp, fp2);
      localStorage.setItem(LS.cacheItems, JSON.stringify(items));

      render();
      return true;
    }

    async function loadItems(){
      statusEl.textContent = "Yükleniyor...";

      const hadCache = loadFromCache();
      if (hadCache) statusEl.textContent = "Güncelleniyor...";

      try{
        await fetchFromArchive();
        statusEl.textContent = "";
      }catch(err){
        console.error(err);
        statusEl.textContent = hadCache ? "" : "Arşivden kayıtlar çekilemedi.";
      }

      setInterval(() => {
        fetchFromArchive().catch(() => {});
      }, 180000);
    }

    // =========================
    // Filtering + sorting
    // =========================
    function getVisibleItems(){
      const q = normTR((searchEl.value || "").trim());

      let arr = items.filter(it => {
        if (q && !normTR(it.title).includes(q)) return false;
        if (filterFav && !favs[it.id]) return false;
        if (filterSel && !sels[it.id]) return false;
        return true;
      });

      if (sortMode === "dur"){
        const dir = (durSortDir === "asc") ? 1 : -1;
        arr.sort((a,b) => {
          const ha = (durs[a.id] > 0);
          const hb = (durs[b.id] > 0);
          if (ha !== hb) return ha ? -1 : 1;
          if (ha && hb){
            const da = durs[a.id];
            const db = durs[b.id];
            if (da !== db) return (da - db) * dir;
          }
          return a.title.localeCompare(b.title, "tr");
        });
      }
